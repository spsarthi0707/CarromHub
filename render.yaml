# Temporary free demo deployment. Render free services have ephemeral storage.
services:
  - type: web
    name: carromhub
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /tmp/data
      - key: OTP_DELIVERY
        value: dev
      - key: ADMIN_KEY
        generateValue: true
