# Fly.io — `fly launch --copy-config --no-deploy`, then `fly volumes create carrom_data -s 1`, then `fly deploy`.
app = "carromhub"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ALLOWED_HOSTS = "*"
  TRUST_PROXY = "1"
  DATA_DIR = "/app/data"
  OTP_DELIVERY = "dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "3s"

[mounts]
  source = "carrom_data"
  destination = "/app/data"
